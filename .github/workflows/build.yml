name: Build Mutant Mobs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build mod
        run: gradle build --no-daemon
        working-directory: MutantMobs-Forge-1.16.5

      - uses: actions/upload-artifact@v4
        with:
          name: MutantMobs-JAR
          path: MutantMobs-Forge-1.16.5/build/libs/*.jar
